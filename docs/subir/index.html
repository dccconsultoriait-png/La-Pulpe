<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E4459">
<title>Multiredes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pet:#0E4459;--coral:#FF5A4E;--agua:#E6F0F2;--ink:#0B1630;--mut:#5a707a;--line:#e3ecef;--ok:#0a7a4f}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--agua);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Manrope,system-ui,sans-serif;font-weight:800;line-height:1.15;margin:0 0 .35em}
.app{max-width:520px;margin:0 auto;min-height:100%;background:#fff;display:flex;flex-direction:column}
header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
header b{font-family:Manrope,sans-serif;font-size:18px}
header span{font-size:13px;color:var(--mut);text-align:right}
main{flex:1;padding:16px 18px 96px}
section[hidden]{display:none}
.cupo{background:var(--agua);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.cupo b{color:var(--pet)}
.regalo{background:#fff4e5;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--agua);border-radius:24px;padding:4px;margin-bottom:14px}
.switch button{border:0;background:none;border-radius:20px;min-height:42px;font:600 15px Inter,sans-serif;color:var(--pet);cursor:pointer}
.switch button[aria-pressed=true]{background:var(--pet);color:#fff}
.drop{border:2px dashed #9fc0cb;border-radius:20px;padding:22px 16px;text-align:center;background:#f3f8f9}
.drop p{margin:6px 0 14px;font-size:14px;color:#3d5662}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:23px;border:0;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn.c{background:var(--coral);color:#fff}.btn.p{background:var(--pet);color:#fff}.btn.g{background:var(--agua);color:var(--pet)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.switch button:focus-visible,nav button:focus-visible{outline:3px solid #7fc4d6;outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
label.lbl{display:block;font-size:14px;color:#3d5662;margin:16px 0 6px}
textarea{width:100%;font:16px Inter,sans-serif;padding:12px;border:1px solid #c3d6dc;border-radius:12px;resize:vertical;min-height:70px}
.full{width:100%;margin-top:12px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.err{color:#b3261e;font-size:14px;margin-top:10px}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:12px}
.pv img,.pv video{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--ink)}
.pv video{aspect-ratio:9/16;grid-column:1/-1;max-height:280px;width:auto;margin:0 auto}
.bar{height:10px;background:var(--agua);border-radius:5px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--coral);transition:width .2s}
.item{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.item .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.item .t b{font-size:15px}
.chip{font-size:12px;font-weight:600;padding:2px 10px;border-radius:12px;background:var(--agua);color:var(--pet);white-space:nowrap}
.chip.on{background:#fff4e5;color:#8a4b00}.chip.ok{background:#e3f5ec;color:var(--ok)}.chip.bad{background:#fde8e7;color:#b3261e}
.cap{font-size:14px;background:#f3f8f9;border-radius:12px;padding:10px 12px;white-space:pre-line;margin:10px 0;max-height:220px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;min-width:110px;padding:0 12px;font-size:14px;min-height:42px}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:40px 10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:3}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{font:600 13px Inter,sans-serif;background:none;border:0;padding:12px 4px;min-height:56px;color:var(--mut);cursor:pointer;position:relative}
nav button[aria-selected=true]{color:var(--pet)}
nav button[aria-selected=true]::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--pet)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;margin-left:4px}
.badge[hidden]{display:none}
.center{text-align:center;padding:60px 20px;color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <header><b id="h-nombre">Multiredes</b><span id="h-plan"></span></header>
  <main>
    <div id="cargando" class="center">Cargando…</div>
    <div id="fatal" class="center" hidden></div>

    <section id="v-subir" hidden>
      <div class="cupo" id="cupo"></div>
      <div class="regalo" id="regalo" hidden></div>
      <div class="switch" role="group" aria-label="Qué querés subir">
        <button type="button" id="m-video" aria-pressed="true">Video</button>
        <button type="button" id="m-fotos" aria-pressed="false">Fotos</button>
      </div>
      <div class="drop">
        <h3 id="d-tit">Subí tu video crudo</h3>
        <p id="d-txt">Grabalo vertical, sin editar. Si te trabás, seguí hablando: los cortes los hacemos nosotros.</p>
        <label class="btn c" for="file" id="d-btn">Elegir video</label>
        <input type="file" id="file" accept="video/*">
        <div class="pv" id="pv"></div>
        <p class="note" id="fname"></p>
      </div>
      <label class="lbl" for="nota">¿Querés comunicar algo en especial? Una promo, un evento, un sorteo, un aniversario… (opcional)</label>
      <textarea id="nota" maxlength="1000" placeholder="Ej: este domingo 2x1 en vermut de 11 a 12"></textarea>
      <button class="btn p full" id="send" disabled>Enviar a editar</button>
      <div class="bar" id="bar" hidden><i></i></div>
      <p class="note" id="estado" aria-live="polite"></p>
      <p class="err" id="error" role="alert"></p>
    </section>

    <section id="v-proc" hidden><div id="l-proc"></div></section>
    <section id="v-listos" hidden><div id="l-listos"></div></section>
  </main>
  <nav><div role="tablist" aria-label="Secciones">
    <button role="tab" id="t-subir" aria-selected="true">Subir</button>
    <button role="tab" id="t-proc" aria-selected="false">En proceso<span class="badge" id="b-proc" hidden></span></button>
    <button role="tab" id="t-listos" aria-selected="false">Listos<span class="badge" id="b-listos" hidden></span></button>
  </div></nav>
</div>
<script>
'use strict';
// Dirección de la API (flujo "Multiredes: página de subida" en n8n)
const API = 'https://n8n-fg3m.srv2056463.hstgr.cloud/webhook/multiredes-api';

const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';
let datos = null, modo = 'video', archivos = [], subiendo = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = s => s ? new Date(s).toLocaleString('es-AR', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
const mb = n => (n / 1048576).toFixed(1) + ' MB';

async function api(accion, extra = {}) {
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({accion, t: token, ...extra})});
  if (!r.ok) throw new Error('El servidor respondió ' + r.status);
  const j = await r.json();
  return Array.isArray(j) ? j[0] : j;
}

// ---------- pestañas ----------
const tabs = ['subir', 'proc', 'listos'];
function show(t) { for (const x of tabs) { $('t-' + x).setAttribute('aria-selected', x === t); $('v-' + x).hidden = x !== t; } }
for (const x of tabs) $('t-' + x).addEventListener('click', () => { if (datos) show(x); });

// ---------- modo video / fotos ----------
function setModo(m) {
  if (subiendo) return;
  modo = m;
  $('m-video').setAttribute('aria-pressed', m === 'video');
  $('m-fotos').setAttribute('aria-pressed', m === 'fotos');
  const f = $('file');
  f.value = ''; archivos = []; pintarArchivos();
  if (m === 'video') {
    f.accept = 'video/*'; f.multiple = false;
    $('d-tit').textContent = 'Subí tu video crudo';
    $('d-txt').textContent = 'Grabalo vertical, sin editar. Si te trabás, seguí hablando: los cortes los hacemos nosotros.';
    $('d-btn').textContent = 'Elegir video';
  } else {
    f.accept = 'image/*'; f.multiple = true;
    $('d-tit').textContent = 'Subí tus fotos';
    $('d-txt').textContent = 'Con 1 foto armamos un post y una historia. Con 2 a 10 fotos, un carrusel.';
    $('d-btn').textContent = 'Elegir fotos';
  }
}
$('m-video').addEventListener('click', () => setModo('video'));
$('m-fotos').addEventListener('click', () => setModo('fotos'));

$('file').addEventListener('change', e => {
  const lista = [...e.target.files];
  if (modo === 'fotos' && lista.length > 10) { $('error').textContent = 'Elegí hasta 10 fotos.'; archivos = lista.slice(0, 10); }
  else { $('error').textContent = ''; archivos = lista; }
  pintarArchivos();
});

function pintarArchivos() {
  const pv = $('pv');
  for (const el of pv.querySelectorAll('[src^="blob:"]')) URL.revokeObjectURL(el.src);
  pv.innerHTML = '';
  for (const f of archivos) {
    const el = document.createElement(f.type.startsWith('video/') ? 'video' : 'img');
    el.src = URL.createObjectURL(f);
    if (el.tagName === 'VIDEO') { el.muted = true; el.playsInline = true; el.loop = true; el.play().catch(() => {}); }
    else el.alt = '';
    pv.appendChild(el);
  }
  const total = archivos.reduce((a, f) => a + f.size, 0);
  $('fname').textContent = archivos.length
    ? (modo === 'video' ? archivos[0].name + ' · ' + mb(total)
       : archivos.length + (archivos.length === 1 ? ' foto: post y historia' : ' fotos: carrusel') + ' · ' + mb(total))
    : '';
  $('send').disabled = !archivos.length || subiendo;
}

// ---------- fotos: derechas, livianas y en JPG antes de subir ----------
async function normalizarFoto(f) {
  try {
    const img = await createImageBitmap(f, {imageOrientation: 'from-image'});
    const MAX = 2400, k = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    if (!blob) return f;
    return new File([blob], f.name.replace(/\.[^.]+$/, '') + '.jpg', {type: 'image/jpeg'});
  } catch (_) { return f; }   // si el navegador no puede, va la original
}

// ---------- subir ----------
function subirArchivo(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) {
        try { resolve(JSON.parse(x.responseText).id); } catch (_) { reject(new Error('Respuesta rara de Drive')); }
      } else reject(new Error('Drive respondió ' + x.status));
    };
    x.onerror = () => reject(new Error('Se cortó la conexión'));
    x.send(file);
  });
}

$('send').addEventListener('click', async () => {
  if (!archivos.length || subiendo) return;
  const tipo = modo === 'video' ? 'video' : (archivos.length === 1 ? 'foto' : 'carrusel');
  subiendo = true; $('send').disabled = true; $('error').textContent = '';
  $('estado').textContent = 'Preparando…'; $('bar').hidden = false; $('bar').firstChild.style.width = '0';
  try {
    if (tipo !== 'video') {
      $('estado').textContent = 'Preparando las fotos…';
      archivos = await Promise.all(archivos.map(normalizarFoto));
    }
    const p = await api('preparar', {
      tipo, nota: $('nota').value.trim(),
      archivos: archivos.map(f => ({nombre: f.name, mime: f.type || (tipo === 'video' ? 'video/mp4' : 'image/jpeg'), tamano: f.size}))
    });
    if (!p.ok) throw new Error(p.error || 'No se pudo preparar la subida');
    const total = archivos.reduce((a, f) => a + f.size, 0);
    let hechos = 0;
    const listos = [];
    for (let i = 0; i < archivos.length; i++) {
      const dest = p.archivos[i];
      $('estado').textContent = archivos.length > 1 ? `Subiendo ${i + 1} de ${archivos.length}…` : 'Subiendo… no cierres esta página.';
      let id = null, intento = 0;
      while (!id) {
        try {
          id = await subirArchivo(dest.url, archivos[i], n => { $('bar').firstChild.style.width = Math.round((hechos + n) / total * 100) + '%'; });
        } catch (e) {
          if (++intento >= 3) throw e;
          $('estado').textContent = 'Se cortó, reintentando…';
          await new Promise(r => setTimeout(r, 2000 * intento));
        }
      }
      hechos += archivos[i].size;
      listos.push({nombre: dest.nombre, file_id: id});
    }
    $('estado').textContent = 'Confirmando…';
    const c = await api('confirmar', {pedido_id: p.pedido_id, archivos: listos});
    if (!c.ok) throw new Error(c.error || 'No se pudo confirmar');
    $('estado').textContent = '¡Listo! Ya lo estamos editando. Te avisamos por mail cuando esté.';
    $('nota').value = ''; archivos = []; $('file').value = ''; pintarArchivos();
    await cargar();
    show('proc');
  } catch (e) {
    $('error').textContent = e.message + '. Probá de nuevo en un rato.';
    $('estado').textContent = '';
  } finally {
    subiendo = false; $('bar').hidden = true; $('send').disabled = !archivos.length;
  }
});

// ---------- listas ----------
const NOMBRE = {video: 'Video', foto: 'Foto', carrusel: 'Carrusel'};
function chip(p, cupoLleno) {
  if (p.estado === 'subiendo') return '<span class="chip on">Subiendo</span>';
  if (p.estado === 'crudo') return cupoLleno ? '<span class="chip">Espera al lunes</span>' : '<span class="chip">En fila</span>';
  if (p.estado === 'en_proceso') return '<span class="chip on">Editando</span>';
  if (p.estado === 'error') return '<span class="chip bad">Con problema</span>';
  return '<span class="chip ok">Listo</span>';
}
const ver = id => id ? 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view' : null;

function pintarListas() {
  const ped = datos.pedidos || [];
  const proc = ped.filter(p => ['subiendo', 'crudo', 'en_proceso', 'error'].includes(p.estado));
  const listos = ped.filter(p => ['listo', 'publicado', 'cambio_pedido'].includes(p.estado));
  const lleno = datos.cupo && datos.cupo.limite != null && datos.cupo.usadas >= datos.cupo.limite;

  $('l-proc').innerHTML = proc.length ? proc.map(p => `
    <div class="item"><div class="t"><b>${NOMBRE[p.tipo] || 'Pedido'}${p.cantidad > 1 ? ' · ' + p.cantidad + ' fotos' : ''}</b>${chip(p, lleno)}</div>
    <p class="note">Subido ${esc(fecha(p.creado))}</p>
    ${p.nota ? `<p class="note">Tu indicación: ${esc(p.nota)}</p>` : ''}
    ${p.estado === 'error' ? '<p class="note">Algo falló con este. Ya nos llegó el aviso y lo revisamos.</p>' : ''}</div>`).join('')
    : '<p class="empty">No hay nada en proceso.</p>';

  $('l-listos').innerHTML = listos.length ? listos.map((p, i) => {
    const texto = [p.caption, p.hashtags].filter(Boolean).join('\n\n');
    const NOMBRE_SALIDA = {post: 'Post', historia: 'Historia', placa: 'Placa'};
    const links = (p.salidas && p.salidas.length)
      ? p.salidas.map(x => [NOMBRE_SALIDA[x.tipo] + (x.tipo === 'placa' ? ' ' + x.n : ''), x.file_id])
      : [['Reel', p.reel], ['Historia', p.historia], ['Portada', p.portada]].filter(x => x[1]);
    return `<div class="item"><div class="t"><b>${esc(p.titulo || NOMBRE[p.tipo])}</b>${chip(p)}</div>
      <p class="note">Listo ${esc(fecha(p.listo_en))}</p>
      ${texto ? `<div class="cap" id="cap-${i}">${esc(texto)}</div>` : ''}
      <div class="row">${texto ? `<button class="btn p" data-copiar="${i}">Copiar texto</button>` : ''}
      ${links.map(([n, id]) => `<a class="btn g" href="${ver(id)}" target="_blank" rel="noopener">${n}</a>`).join('')}</div>
      <p class="note" id="msg-${i}" aria-live="polite"></p></div>`;
  }).join('') : '<p class="empty">Cuando tu contenido esté listo, aparece acá.</p>';

  const bp = proc.length, bl = listos.filter(p => p.listo_en && Date.now() - new Date(p.listo_en) < 3 * 864e5).length;
  $('b-proc').hidden = !bp; $('b-proc').textContent = bp;
  $('b-listos').hidden = !bl; $('b-listos').textContent = bl;
}

$('l-listos').addEventListener('click', async e => {
  const i = e.target.dataset && e.target.dataset.copiar;
  if (i == null) return;
  try { await navigator.clipboard.writeText($('cap-' + i).textContent); $('msg-' + i).textContent = 'Texto copiado. Pegalo al publicar.'; }
  catch (_) { $('msg-' + i).textContent = 'No pude copiar: mantené apretado el texto y copialo a mano.'; }
});

function pintarCupo() {
  const c = datos.cupo || {};
  if (c.limite == null) $('cupo').innerHTML = 'Plan <b>' + esc(datos.plan) + '</b>: sin límite de piezas.';
  else {
    const per = c.semanal ? ' esta semana' : '';
    $('cupo').innerHTML = c.quedan > 0
      ? `Te quedan <b>${c.quedan} de ${c.limite}</b> piezas${per}. Un video o una foto es 1 pieza, un carrusel son 2.`
      : `Ya usaste tus <b>${c.limite}</b> piezas${per}. Lo que subas ahora lo editamos ${c.semanal ? 'desde el lunes' : 'cuando renueves'}.`;
  }
  const regalos = (datos.regalos || []).filter(g => g.tipo === 'carrusel');
  $('regalo').hidden = !regalos.length;
  $('regalo').textContent = regalos.length ? '🎁 Tenés un carrusel de regalo: subí de 2 a 10 fotos y no cuenta en tu cupo.' : '';
}

async function cargar() {
  const d = await api('info');
  if (!d.ok) throw new Error(d.error || 'Link no válido');
  datos = d;
  document.title = d.nombre + ' · ' + d.servicio;
  $('h-nombre').textContent = d.nombre;
  $('h-plan').textContent = d.servicio + ' · Plan ' + d.plan;
  pintarCupo(); pintarListas();
  if (!d.activo) {
    $('send').disabled = true;
    $('error').textContent = 'Tu cuenta está pausada. Escribinos para reactivarla.';
  }
}

(async () => {
  if (!/^[0-9a-f-]{36}$/i.test(token)) {
    $('cargando').hidden = true; $('fatal').hidden = false;
    $('fatal').textContent = 'Este link está incompleto. Abrí el link que te mandamos por mail.';
    return;
  }
  try {
    await cargar();
    $('cargando').hidden = true; show('subir');
    setInterval(() => { if (!subiendo && !document.hidden) cargar().catch(() => {}); }, 60000);
  } catch (e) {
    $('cargando').hidden = true; $('fatal').hidden = false;
    $('fatal').textContent = e.message;
  }
})();
</script>
</body>
</html>
